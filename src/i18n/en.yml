tonesPage:
  title: Thai Tones
  intro: Thai has five tones. A syllable's tone comes from its consonant class, whether it is live or dead, and its tone mark.
  five: The five tones
  vowelTones: Short and long vowels
  vowelTonesNote: With no tone mark and no final consonant, the tone comes from the vowel's length and the consonant's group. A short vowel makes a dead syllable, a long vowel a live one.
  marks: Tone marks
  marksNote: A tone mark sets the tone of a syllable; the tone it gives depends on the consonant's group.
